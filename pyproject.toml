[project]
name = "dumpyara"
version = "1.1.0"
description = "Android firmware extractor"
authors = [{ name = "Sebastiano Barezzi", email = "seba@sebaubuntu.dev" }]
license = "GPL-3.0-or-later"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "brotli>=1.0.9,<2",
    "protobuf>=4.22.1,<8",
    "sebaubuntu-libs>=2.0.0,<3",
    "liblp>=1.0.2,<2",
    "py7zr>=1.0.0,<2",
    "lz4>=4.3.3,<5",
    "zstandard>=0.23,<0.26",
]

[project.urls]
repository = "https://github.com/sebaubuntu-python/dumpyara"

[project.scripts]
dumpyara = "dumpyara.main:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
exclude = ["dumpyara/lib/libpayload/update_metadata_pb2.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
docstring-code-format = true

[tool.pyright]
ignore = ["dumpyara/lib/libpayload/__init__.py", "dumpyara/lib/libpayload/update_metadata_pb2.py"]
stubPath = "typings"
